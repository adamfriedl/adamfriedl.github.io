<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adam Friedl</title>
    <link rel="stylesheet" href="/site.css" />
    <style>
      .poster {
        min-height: 58vh;
        background-color: var(--poster-blue);
        display: flex;
        align-items: flex-end;
        padding: var(--gutter);
      }

      .name {
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(2.75rem, calc((100vw - 2 * var(--gutter)) / 4.3), 11rem);
        line-height: 0.86;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--paper);
        max-width: 100%;
      }

      .name span {
        display: block;
      }

      .bio {
        font-size: 1.125rem;
        line-height: 1.6;
        max-width: 42ch;
        margin-bottom: 1.75rem;
      }

      @media (max-width: 480px) {
        .bio {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="poster">
      <h1 class="name" aria-label="Adam Friedl">
        <span>Adam</span>
        <span>Friedl</span>
      </h1>
    </header>
    <main class="page">
      <p class="bio">Software engineer and lawyer</p>
      <nav class="links" aria-label="Contact">
        <a href="mailto:me@adamfriedl.com">Email</a>
        <span class="sep" aria-hidden="true">·</span>
        <a href="https://www.linkedin.com/in/adamfriedl">LinkedIn</a>
        <span class="sep" aria-hidden="true">·</span>
        <a href="/resume.html">Resume</a>
        <span class="sep" aria-hidden="true">·</span>
        <a href="/projects.html">Projects</a>
      </nav>
    </main>
  </body>
</html>

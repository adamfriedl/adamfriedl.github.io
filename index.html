<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adam Friedl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --poster-blue: #0050C8;
        --ink: #1A1A1A;
        --paper: #FFFFFF;
        --gutter: clamp(1.5rem, 6vw, 5rem);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        background-color: var(--paper);
        color: var(--ink);
        font-family: Inter, Helvetica, system-ui, sans-serif;
      }

      .poster {
        min-height: 58vh;
        background-color: var(--poster-blue);
        display: flex;
        align-items: flex-end;
        padding: var(--gutter);
      }

      .name {
        font-family:
          'Barlow Condensed', 'Helvetica Neue Condensed', 'Helvetica Condensed', 'Arial Narrow',
          sans-serif;
        font-weight: 800;
        font-size: clamp(3.75rem, 18vw, 11rem);
        line-height: 0.86;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: var(--paper);
      }

      .name span {
        display: block;
      }

      .content {
        padding: var(--gutter);
        padding-top: clamp(2rem, 4vw, 3.25rem);
      }

      .bio {
        font-size: 1.125rem;
        line-height: 1.6;
        max-width: 42ch;
        margin-bottom: 1.75rem;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.35em 0.7em;
        font-size: 1.125rem;
        font-weight: 600;
      }

      .links a {
        color: var(--poster-blue);
        text-decoration: underline;
        text-decoration-color: var(--poster-blue);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.18em;
      }

      .links a:focus-visible {
        outline: 2px solid var(--poster-blue);
        outline-offset: 3px;
      }

      .links .sep {
        color: var(--poster-blue);
        font-weight: 600;
        user-select: none;
      }

      @media (max-width: 480px) {
        .name {
          font-size: clamp(3.25rem, 22vw, 5.5rem);
        }

        .bio,
        .links {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="poster">
      <h1 class="name" aria-label="Adam Friedl">
        <span>Adam</span>
        <span>Friedl</span>
      </h1>
    </header>
    <main class="content">
      <p class="bio">
        Senior DevOps Engineer at Rakuten. Former public-interest lawyer. Thanks for stopping by my
        corner of the internet!
      </p>
      <nav class="links" aria-label="Contact">
        <a href="mailto:hi@adamfriedl.com">Email</a>
        <span class="sep" aria-hidden="true">·</span>
        <a href="https://www.linkedin.com/in/adamfriedl">LinkedIn</a>
        <span class="sep" aria-hidden="true">·</span>
        <a href="/resume.html">Resume</a>
      </nav>
    </main>
  </body>
</html>
